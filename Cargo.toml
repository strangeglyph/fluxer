[workspace]
members = [
	"fluxer_admin",
	"fluxer_app_proxy",
	"fluxer_common",
	"fluxer_media_proxy",
	"fluxer_gifs",
	"fluxer_svc",
	"fluxer_messages",
	"fluxer_push",
	"fluxer_snowflakes",
	"fluxer_users",
	"fluxer_unfurl",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
